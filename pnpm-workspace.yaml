ignoreWorkspaceRootCheck: true

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - eslint-plugin-pnpm@1.9.1
  - pnpm-workspace-yaml@1.9.1
  - eslint-plugin-antfu@3.3.1
  - '@es-joy/jsdoccomment@1.0.0'
  - '@eslint-react/ast@5.28.6'
  - '@eslint-react/core@5.28.6'
  - '@eslint-react/eslint-plugin@5.28.6'
  - '@eslint-react/eslint@5.28.6'
  - '@eslint-react/jsx@5.28.6'
  - '@eslint-react/shared@5.28.6'
  - '@eslint-react/var@5.28.6'
  - '@vitest/eslint-plugin@1.6.28'
  - baseline-browser-mapping@2.11.31
  - eslint-plugin-jsdoc@65.4.1
  - eslint-plugin-react-dom@5.28.6
  - eslint-plugin-react-jsx@5.28.6
  - eslint-plugin-react-naming-convention@5.28.6
  - eslint-plugin-react-rsc@5.28.6
  - eslint-plugin-react-web-api@5.28.6
  - eslint-plugin-react-x@5.28.6
  - jsdoc-type-pratt-parser@9.4.0
  - svelte-eslint-parser@1.10.0

trustPolicy: no-downgrade
trustPolicyExclude:
  - cached-factory@0.1.0

update:
  ignoreDeps:
    - typescript@7

strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true

packages:
  - fixtures/*

allowBuilds:
  esbuild: true
  simple-git-hooks: true

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks
  - unrs-resolver

